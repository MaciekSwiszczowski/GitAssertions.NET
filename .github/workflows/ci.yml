name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Debug_Analyzers is the gate: full analyzer set, warnings as errors, NuGet audit on.
  CONFIGURATION: Debug_Analyzers

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not hide how the others do: each leg reports its own result.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      # Every action is pinned to a commit SHA, with its release in the comment (spec, Security > Supply chain).
      # Dependabot moves the SHA and the comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # The analyzer packages are referenced only under Debug_Analyzers, so restore must see that configuration.
      - name: Restore
        run: dotnet restore -p:Configuration=${{ env.CONFIGURATION }}

      - name: Build
        run: dotnet build --configuration ${{ env.CONFIGURATION }} --no-restore

      # The integration tests run the git CLI and fail on a git older than 2.32. Printing the version here, before
      # them, traces a failure after a runner image update to the git it brought.
      - name: Git version
        run: git --version

      - name: Test
        run: dotnet test --configuration ${{ env.CONFIGURATION }} --no-build
